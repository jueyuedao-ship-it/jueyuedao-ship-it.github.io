<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#111827">
  <meta name="color-scheme" content="light dark">
  <title>PWA Launcher</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <style>
    :root {
      color-scheme: light dark;
      --bg: #f4f7fb;
      --panel: rgba(255, 255, 255, 0.88);
      --text: #111827;
      --muted: #64748b;
      --border: rgba(15, 23, 42, 0.12);
      --accent: #2563eb;
      --shadow: 0 12px 30px rgba(15, 23, 42, 0.08);
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #090e1a;
        --panel: rgba(17, 24, 39, 0.9);
        --text: #f8fafc;
        --muted: #94a3b8;
        --border: rgba(148, 163, 184, 0.18);
        --accent: #60a5fa;
        --shadow: 0 12px 30px rgba(0, 0, 0, 0.28);
      }
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    main {
      width: min(1080px, calc(100% - 32px));
      margin: 0 auto;
      padding: 56px 0 72px;
    }

    header {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 28px;
    }

    h1 {
      margin: 0;
      font-size: clamp(2rem, 6vw, 3.8rem);
      line-height: 1;
      letter-spacing: -0.045em;
    }

    .subtitle {
      margin: 12px 0 0;
      color: var(--muted);
      font-size: 0.98rem;
    }

    .count {
      flex: none;
      color: var(--muted);
      font-size: 0.9rem;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 16px;
    }

    .card {
      display: flex;
      flex-direction: column;
      min-height: 210px;
      padding: 22px;
      border: 1px solid var(--border);
      border-radius: 20px;
      background: var(--panel);
      box-shadow: var(--shadow);
      backdrop-filter: blur(14px);
    }

    .badge {
      display: inline-grid;
      place-items: center;
      width: 44px;
      height: 44px;
      border-radius: 13px;
      margin-bottom: 18px;
      background: color-mix(in srgb, var(--accent) 14%, transparent);
      color: var(--accent);
      font-weight: 800;
      letter-spacing: -0.04em;
    }

    .card h2 {
      margin: 0;
      font-size: 1.12rem;
      line-height: 1.35;
    }

    .description {
      margin: 9px 0 20px;
      color: var(--muted);
      font-size: 0.9rem;
      line-height: 1.65;
      flex: 1;
    }

    .actions {
      display: flex;
      gap: 9px;
    }

    a {
      text-decoration: none;
    }

    .button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 42px;
      padding: 0 15px;
      border-radius: 11px;
      font-weight: 700;
      font-size: 0.9rem;
      border: 1px solid var(--border);
    }

    .primary {
      flex: 1;
      color: white;
      background: #2563eb;
      border-color: transparent;
    }

    .secondary {
      color: var(--text);
      background: transparent;
    }

    .status {
      padding: 24px;
      border: 1px dashed var(--border);
      border-radius: 16px;
      color: var(--muted);
    }

    footer {
      margin-top: 28px;
      color: var(--muted);
      font-size: 0.82rem;
    }

    @media (max-width: 600px) {
      main {
        width: min(100% - 22px, 1080px);
        padding-top: 34px;
      }

      header {
        align-items: flex-start;
        flex-direction: column;
      }

      .grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <div>
        <h1>PWA Launcher</h1>
        <p class="subtitle">GitHub Pages に公開しているアプリをここから開けます。</p>
      </div>
      <div class="count" id="count">読み込み中…</div>
    </header>

    <section class="grid" id="apps" aria-live="polite">
      <div class="status">アプリ一覧を読み込んでいます。</div>
    </section>

    <footer>jueyuedao-ship-it.github.io</footer>
  </main>

  <script>
    const account = 'jueyuedao-ship-it';
    const appsElement = document.querySelector('#apps');
    const countElement = document.querySelector('#count');

    const escapeHtml = (value) => String(value).replace(/[&<>'"]/g, (char) => ({
      '&': '&amp;',
      '<': '&lt;',
      '>': '&gt;',
      "'": '&#39;',
      '"': '&quot;'
    })[char]);

    const initials = (name) => {
      const clean = String(name).trim();
      if (!clean) return 'P';
      const words = clean.split(/\s+/).filter(Boolean);
      return words.length > 1
        ? `${words[0][0]}${words[1][0]}`.toUpperCase()
        : clean.slice(0, 2).toUpperCase();
    };

    const renderApps = (apps) => {
      countElement.textContent = `${apps.length} apps`;
      appsElement.innerHTML = apps.map((app) => {
        const name = escapeHtml(app.name || app.repo);
        const shortName = escapeHtml(app.shortName || app.name || app.repo);
        const description = escapeHtml(app.description || '');
        const repo = encodeURIComponent(app.repo);
        const appUrl = `https://${account}.github.io/${repo}/`;
        const repoUrl = `https://github.com/${account}/${repo}`;

        return `
          <article class="card">
            <div class="badge" aria-hidden="true">${escapeHtml(initials(shortName))}</div>
            <h2>${name}</h2>
            <p class="description">${description}</p>
            <div class="actions">
              <a class="button primary" href="${appUrl}" target="_blank" rel="noopener">Open App</a>
              <a class="button secondary" href="${repoUrl}" target="_blank" rel="noopener" aria-label="${name} のGitHubリポジトリ">GitHub</a>
            </div>
          </article>`;
      }).join('');
    };

    fetch('./apps.json', { cache: 'no-store' })
      .then((response) => {
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        return response.json();
      })
      .then((apps) => {
        if (!Array.isArray(apps)) throw new Error('apps.json must be an array');
        renderApps(apps);
      })
      .catch((error) => {
        console.error(error);
        countElement.textContent = '読み込み失敗';
        appsElement.innerHTML = '<div class="status">アプリ一覧を読み込めませんでした。オンライン状態を確認して再読み込みしてください。</div>';
      });

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch(console.error);
      });
    }
  </script>
</body>
</html>
